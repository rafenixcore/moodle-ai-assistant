[project]
name = "moodle-mcp"
version = "0.1.0"
description = "Servidor MCP para gestionar Moodle via Web Services REST"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",   # <2: la v2 del SDK elimino FastMCP (API distinta)
    "httpx>=0.27",
]

[project.scripts]
moodle-mcp = "moodle_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
